  <style>
    /* [Your existing CSS here - keeping it compact] */
    :root {
      --teal-primary: #00596B;
      --teal-dark: #003D4A;
      --teal-light: #4A8B99;
      --teal-pale: #E6F3F5;
      --white: #FFFFFF;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-300: #D1D5DB;
      --gray-400: #9CA3AF;
      --gray-500: #6B7280;
      --gray-600: #4B5563;
      --gray-700: #374151;
      --gray-800: #1F2937;
      --gray-900: #111827;
      --green-success: #10B981;
      --red-error: #EF4444;
      --orange-warning: #F59E0B;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; color:var(--gray-900); background:var(--white); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
    h1,h2,h3,h4,h5,h6 { font-family:'Source Serif 4',serif; font-weight:600; line-height:1.2; }
    .container { width:100%; padding:0 20px; margin:0 auto; }

    @media(min-width:1024px){ .container { max-width:1024px; } }
    @media(min-width:1280px){ .container { max-width:1200px; } }
    
    /* Navigation */
    .top-nav { background:var(--white); border-bottom:1px solid var(--gray-200); position:sticky; top:0; z-index:1000; box-shadow:var(--shadow-sm); }
    .top-nav-inner { display:flex; align-items:center; justify-content:space-between; height:70px; padding:0 16px; max-width:100%; }
    @media(min-width:1024px){ .top-nav-inner { padding:0 40px; max-width:1400px; margin:0 auto; } }
    .logo-box { background:var(--teal-primary); padding:10px 16px; border-radius:4px; display:flex; flex-direction:column; align-items:flex-start; flex-shrink:0; }
    .logo-text { font-family:'Source Serif 4',serif; font-size:14px; font-weight:700; color:var(--white); letter-spacing:-0.5px; line-height:1.1; text-transform:uppercase; }
    .logo-tagline { font-size:8px; color:rgba(255,255,255,0.85); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }

    @media(min-width:1024px){ .logo-text { font-size:20px; } .logo-tagline { font-size:10px; } }

    .nav-link { font-size:14px; font-weight:500; color:var(--gray-700); text-decoration:none; transition:color .2s; cursor:pointer; background:none; border:none; font-family:inherit; }
    .nav-link:hover,.nav-link.active { color:var(--teal-primary); }

    @media(min-width:768px){ .nav-actions select { padding:8px 12px; font-size:14px; } }

    @media(min-width:1024px){ .mobile-menu-btn { display:none; } }
    
    /* Mobile Menu */
    .mobile-menu-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:1100; animation:fadeIn .25s ease-out; }
    .mobile-menu-overlay.open { display:block; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .mobile-menu { position:fixed; top:0; right:-100%; width:85%; max-width:380px; height:100vh; height:100dvh; background:var(--white); box-shadow:-8px 0 32px rgba(0,0,0,0.15); transition:right .35s cubic-bezier(0.4,0,0.2,1); z-index:1200; overflow-y:auto; display:flex; flex-direction:column; }

    .mobile-menu-close { background:none; border:none; font-size:32px; color:var(--gray-700); cursor:pointer; padding:8px; line-height:1; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; border-radius:8px; transition:background .2s; }
    .mobile-menu-close:hover { background:var(--gray-100); }

    .mobile-menu-item { display:flex; align-items:center; gap:12px; padding:16px 16px; font-size:15px; font-weight:500; color:var(--gray-700); text-decoration:none; border:none; border-radius:8px; margin-bottom:8px; cursor:pointer; background:transparent; width:100%; text-align:left; font-family:inherit; min-height:52px; transition:all .2s; border-left:3px solid transparent; }

    .account-card-label { font-size:12px; opacity:0.8; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .account-card-number { font-family:'Inter',monospace; font-size:14px; opacity:0.75; margin-bottom:20px; letter-spacing:1px; }
    .account-card-balance { font-size:36px; font-weight:700; margin-bottom:4px; }
    .account-card-balance-label { font-size:13px; opacity:0.75; }
    .account-card.frozen { background:linear-gradient(135deg,var(--gray-600) 0%,var(--gray-700) 100%); }
    
    .stats-grid { display:grid; gap:20px; grid-template-columns:1fr; }

    @media(min-width:1024px){ .stats-grid { grid-template-columns:repeat(3,1fr); } }
    .stat-card { background:var(--white); border:1px solid var(--gray-200); border-radius:8px; padding:24px; text-align:center; }
    .stat-value { font-size:32px; font-weight:700; color:var(--teal-primary); margin-bottom:4px; }
    .stat-label { font-size:14px; color:var(--gray-600); text-transform:uppercase; letter-spacing:1px; }
    
    .table-container { background:var(--white); border:1px solid var(--gray-200); border-radius:8px; overflow-x:auto; }
    .table { width:100%; border-collapse:collapse; }
    .table th { background:var(--gray-50); padding:14px 16px; text-align:left; font-size:12px; font-weight:700; color:var(--gray-700); text-transform:uppercase; letter-spacing:1px; border-bottom:2px solid var(--gray-200); }
    .table td { padding:14px 16px; font-size:14px; color:var(--gray-900); border-bottom:1px solid var(--gray-200); }
    .table tr:last-child td { border-bottom:none; }
    .table tr:hover { background:var(--gray-50); }
    
    .form-group { margin-bottom:20px; }
    .form-label { display:block; font-size:14px; font-weight:600; color:var(--gray-700); margin-bottom:6px; }
    .form-input,.form-select { width:100%; padding:12px 16px; border:1px solid var(--gray-300); border-radius:6px; font-size:14px; font-family:inherit; color:var(--gray-900); background:var(--white); transition:all .2s; }
    .form-input:focus,.form-select:focus { outline:none; border-color:var(--teal-primary); box-shadow:0 0 0 3px var(--teal-pale); }
    .form-hint { font-size:13px; color:var(--gray-500); margin-top:4px; }
    
    .badge { display:inline-flex; align-items:center; padding:4px 12px; border-radius:100px; font-size:12px; font-weight:600; }
    .badge-success { background:#D1FAE5; color:#065F46; }
    .badge-error { background:#FEE2E2; color:#991B1B; }
    .badge-warning { background:#FEF3C7; color:#92400E; }
    .badge-info { background:#DBEAFE; color:#1E40AF; }
    
    .toast { position:fixed; top:80px; right:20px; background:var(--white); border:1px solid var(--gray-200); border-radius:8px; padding:16px 20px; box-shadow:var(--shadow-xl); z-index:2000; animation:slideInRight .3s ease; max-width:400px; display:flex; align-items:flex-start; gap:12px; }
    @keyframes slideInRight { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
    .toast.success { border-left:4px solid var(--green-success); }
    .toast.error { border-left:4px solid var(--red-error); }
    .toast.warning { border-left:4px solid var(--orange-warning); }
    
    .chat-fab { position:fixed; bottom:24px; right:24px; width:60px; height:60px; border-radius:50%; background:var(--teal-primary); color:var(--white); font-size:24px; border:none; cursor:pointer; box-shadow:var(--shadow-xl); display:flex; align-items:center; justify-content:center; z-index:900; transition:all .3s; }
    .chat-fab:hover { background:var(--teal-dark); transform:scale(1.1); }
    .chat-panel { position:fixed; bottom:100px; right:24px; width:90%; max-width:380px; height:500px; background:var(--white); border:1px solid var(--gray-200); border-radius:12px; box-shadow:var(--shadow-xl); display:flex; flex-direction:column; z-index:900; animation:slideUp .3s ease; }
    @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .chat-header { background:var(--teal-primary); color:var(--white); padding:16px 20px; border-radius:12px 12px 0 0; display:flex; align-items:center; justify-content:space-between; }
    .chat-messages { flex:1; overflow-y:auto; padding:16px; background:var(--gray-50); }
    .chat-message { margin-bottom:12px; display:flex; flex-direction:column; }

    .chat-message.user { align-items:flex-end; }
    .chat-message.user .chat-bubble { background:var(--teal-primary); color:var(--white); border-bottom-right-radius:4px; }
    .chat-message.admin { align-items:flex-start; }
    .chat-message.admin .chat-bubble { background:var(--white); border:1px solid var(--gray-200); color:var(--gray-900); border-bottom-left-radius:4px; }
    .chat-time { font-size:11px; color:var(--gray-500); margin-top:4px; padding:0 4px; }
    .chat-input-bar { padding:16px; border-top:1px solid var(--gray-200); display:flex; gap:8px; }
    .chat-input { flex:1; padding:10px 14px; border:1px solid var(--gray-300); border-radius:6px; font-size:14px; font-family:inherit; }
    
    .footer { background:var(--teal-primary); color:var(--white); padding:48px 0 32px; }
    .footer-grid { display:grid; gap:32px; grid-template-columns:1fr; margin-bottom:32px; }

    @media(min-width:1024px){ .footer-grid { grid-template-columns:repeat(4,1fr); } }
    .footer-title { font-size:16px; font-weight:700; margin-bottom:16px; }
    .footer-link { display:block; color:rgba(255,255,255,0.8); text-decoration:none; font-size:14px; margin-bottom:10px; transition:color .2s; }
    .footer-link:hover { color:var(--white); }
    .footer-bottom { border-top:1px solid rgba(255,255,255,0.2); padding-top:24px; text-align:center; font-size:13px; color:rgba(255,255,255,0.7); }
    
    .loader-container { display:flex; align-items:center; justify-content:center; min-height:400px; }
    .loader { width:48px; height:48px; border:4px solid var(--gray-200); border-top-color:var(--teal-primary); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    
    .text-center { text-align:center; }
    .text-muted { color:var(--gray-600); }
    .mb-4 { margin-bottom:16px; }
    .mb-6 { margin-bottom:24px; }
    .mt-4 { margin-top:16px; }
    .mt-6 { margin-top:24px; }
    .hidden { display:none; }
    
    .alert { padding:14px 18px; border-radius:6px; margin-bottom:20px; display:flex; align-items:flex-start; gap:12px; }
    .alert-warning { background:rgba(245,158,11,0.1); border:1px solid var(--orange-warning); color:#92400E; }
    .alert-error { background:#FEE2E2; border:1px solid var(--red-error); color:#991B1B; }
    .alert-info { background:#DBEAFE; border:1px solid #0EA5E9; color:#1E40AF; }
    
    /* Auth */
    .auth-background { position:fixed; top:0; left:0; width:100%; height:100%; background:url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1920&q=80') center/cover no-repeat; z-index:-1; }
    .auth-background::before { content:''; position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(135deg,rgba(0,89,107,0.85) 0%,rgba(0,61,74,0.9) 100%); }
    .auth-page .hero { background:transparent; height:300px; }
    .auth-page .hero::before { display:none; }
    .auth-page .form-container { background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.2); box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    
    .form-section-anchor { scroll-margin-top:20px; }
    
    @media(max-width:414px){ .sign-out-desktop { display:none !important; } .currency-selector-desktop { display:none !important; } .container { padding:0 16px; } .section { padding:40px 0; } .section-title { font-size:24px; } .section-subtitle { font-size:14px; } .stats-grid { grid-template-columns:1fr; } .cards-grid { grid-template-columns:1fr; } .account-card { padding:20px; } .account-card-balance { font-size:28px; } .chat-panel { width:95%; right:2.5%; bottom:80px; height:60vh; max-height:500px; } .chat-fab { bottom:16px; right:16px; width:56px; height:56px; } .mobile-menu { width:90%; max-width:none; right:-90%; } .mobile-menu.open { right:0; } .mobile-menu-items { padding:16px; padding-bottom:40px; } .mobile-menu-item { padding:16px 0; font-size:15px; } .mobile-menu-header { padding:16px; } .mobile-menu-close { font-size:32px; padding:8px; } }

  <script type="text/babel">
    // Simplified working version - All code in one script tag
    (function() {
      'use strict';
      
      // Basic React setup
      const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;
      
      // Mock API for testing
      const API = '/api';
      
      // Currency data
      const CURRENCY_RATES = {
        USD: { rate: 1, symbol: '$', name: 'US Dollar' },
        EUR: { rate: 0.92, symbol: '€', name: 'Euro' },
        GBP: { rate: 0.79, symbol: '£', name: 'British Pound' },
        JPY: { rate: 151.5, symbol: '¥', name: 'Japanese Yen' },
        CNY: { rate: 7.23, symbol: '¥', name: 'Chinese Yuan' },
        CAD: { rate: 1.36, symbol: 'C$', name: 'Canadian Dollar' }

      const fmt = (n, currency = 'USD') => {
        const rate = CURRENCY_RATES[currency]?.rate || 1;
        const converted = (n || 0) * rate;
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: currency }).format(converted);
      };
      
      const fmtDate = d => new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(d));
      const fmtTime = d => new Date(d).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      
      // Simple Toast Component
      const Toast = ({ message, type, onClose }) => {
        useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, []);
        return <div className={`toast ${type}`}><span style={{ fontSize: 20 }}>{type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span><span>{message}</span></div>;
      };
      
      // Language Context
      const LanguageContext = createContext();
      
      const languages = [

        }
      };
      
      const LanguageProvider = ({ children }) => {
        const [currentLanguage, setCurrentLanguage] = useState(() => localStorage.getItem('language') || 'en');
        useEffect(() => { localStorage.setItem('language', currentLanguage); }, [currentLanguage]);
        const t = (key) => translations[currentLanguage]?.[key] || translations.en?.[key] || key;
        const changeLanguage = (langCode) => setCurrentLanguage(langCode);
        return (
          <LanguageContext.Provider value={{ currentLanguage, setCurrentLanguage: changeLanguage, languages, t }}>
            {children}
          </LanguageContext.Provider>
        );
      };
      
      const useTranslation = () => {
        const context = useContext(LanguageContext);
        return context || { currentLanguage: 'en', setCurrentLanguage: () => {}, languages: [], t: (key) => key };
      };
      
      const LanguageSelector = ({ mobile = false }) => {
        const { currentLanguage, setCurrentLanguage, languages } = useTranslation();
        if (mobile) {
          return (
            <select value={currentLanguage} onChange={(e) => setCurrentLanguage(e.target.value)} style={{ width:'100%', padding:'12px 14px', border:'1px solid var(--gray-300)', borderRadius:8, fontSize:14, background:'var(--white)', cursor:'pointer', fontFamily:'inherit', color:'var(--gray-900)' }}>

        return (

        const { t } = useTranslation();
        const [auth, setAuth] = useState(null);

        const [view, setView] = useState('overview');
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

        const [adminData, setAdminData] = useState({ users: [], allTransactions: [], accounts: [] });
        const [loading, setLoading] = useState(false);
        const [toast, setToast] = useState(null);
        const [currency, setCurrency] = useState('USD');
        const [pendingApprovals, setPendingApprovals] = useState([]);
        
        const showToast = (message, type = 'success') => setToast({ message, type });

            setPendingApprovals([]);

            console.error('Load data error:', err);
            showToast('Failed to load data', 'error');
          } finally {
            setLoading(false);
          }
        };
        
        const logout = () => { localStorage.clear(); setAuth(null); setShowLogin(true); };
        
        // Auth
        useEffect(() => {
          const token = localStorage.getItem('token');
          const userStr = localStorage.getItem('user');
          if (token && userStr) {
            try {
              const userObj = JSON.parse(userStr);
              if (userObj && userObj.id) {
                setAuth({ user: userObj, token: token });
                loadData(token, userObj);
              }
            } catch(e) { 
              console.error('Invalid user data:', e);
              localStorage.removeItem('token');
              localStorage.removeItem('user');
            }
          }
        }, []);
        
        // Auth Page (Simplified)

          const { t } = useTranslation();

          const submit = async (e) => {
            e.preventDefault();
            if (!isLogin && form.password !== form.confirmPassword) {
              setToast({ message: 'Passwords do not match', type: 'error' });
              return;

                first_name: form.first_name || 'Test',
                last_name: form.last_name || 'User',
                email: form.email,
                role: 'user'
              };
              const token = 'mock-token-123';

              localStorage.setItem('user', JSON.stringify(userData));
              onAuth(userData, token);
            } catch (error) {
              console.error('Auth error:', error);

              setLoading(false);
            }

            e.preventDefault();
            if (!input.trim()) return;
            setMessages([...messages, { id: Date.now(), message: input.trim(), sender_type: 'user', created_at: new Date().toISOString() }]);

                <div className="chat-panel">

                    {messages.map((m, i) => (
                      <div key={i} className={`chat-message ${m.sender_type}`}>
                        <div className="chat-bubble">{m.message}</div>
                        <div className="chat-time">{fmtTime(m.created_at)}</div>
                      </div>

                    <div ref={bottomRef} />

                  <form onSubmit={send} className="chat-input-bar">
                    <input className="chat-input" placeholder="Type a message..." value={input} onChange={e => setInput(e.target.value)} />
                    <button type="submit" className="btn btn-primary">Send</button>

        };

        if (!auth) {

        }

                        {accounts.map(a => (
                          <div key={a.id} className={`account-card ${a.status === 'frozen' ? 'frozen' : ''}`}>
                            <div className="account-card-label">{a.status === 'frozen' ? '🔒 FROZEN' : 'Checking Account'}</div>
                            <div className="account-card-number">{a.account_number}</div>
                            <div className="account-card-balance">{fmt(a.balance, currency)}</div>
                            <div className="account-card-balance-label">Available balance</div>
                          </div>
                        ))}
                        {accounts.length === 0 && (
                          <div className="card" style={{ gridColumn:'1/-1', padding:60, textAlign:'center' }}>
                            <div style={{ fontSize:48, marginBottom:16 }}>🏦</div>
                            <h3>No accounts yet</h3>
                            <button className="btn btn-primary" onClick={() => { 
                              setAccounts([...accounts, { id: Date.now(), account_number: 'NEW-ACCT-001', balance: 0, status: 'active' }]);
                              showToast('Account opened successfully!');
                            }}>Open Account</button>
                          </div>
                        )}
                      </div>
                      <h2 style={{ fontSize:24, marginBottom:24, color:'var(--teal-primary)' }}>Recent Activity</h2>
                      <div className="table-container">
                        <table className="table">
                          <thead><tr><th>ID</th><th>Date</th><th>Type</th><th>Receiver</th><th>Amount</th></tr></thead>
                          <tbody>
                            {transactions.slice(0, 5).map(tx => (
                              <tr key={tx.id}>
                                <td style={{ fontFamily:'monospace', fontSize:11, color:'var(--gray-500)' }}>#{tx.id}</td>
                                <td>{fmtDate(tx.created_at)}</td>
                                <td style={{ textTransform:'capitalize' }}>{tx.type}</td>
                                <td>{tx.receiver_name || 'N/A'}</td>
                                <td style={{ color: tx.type === 'deposit' ? 'var(--green-success)' : 'var(--red-error)', fontWeight:600 }}>{tx.type === 'deposit' ? '+' : '-'}{fmt(tx.amount, currency)}</td>
                              </tr>
                            ))}
                            {transactions.length === 0 && <tr><td colSpan="5" style={{ textAlign:'center', color:'var(--gray-500)', padding:40 }}>No transactions yet</td></tr>}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                  
                  {view === 'accounts' && (
                    <div>
                      <div className="section-header"><h2 className="section-title">My Accounts</h2></div>
                      <div className="cards-grid">
                        {accounts.map(a => (
                          <div key={a.id} className={`account-card ${a.status === 'frozen' ? 'frozen' : ''}`}>
                            <div className="account-card-label">{a.status === 'frozen' ? '🔒 FROZEN' : 'Checking Account'}</div>
                            <div className="account-card-number">{a.account_number}</div>
                            <div className="account-card-balance">{fmt(a.balance, currency)}</div>
                            <div className="account-card-balance-label">Available balance</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  
                  {view === 'transactions' && (
                    <div>
                      <div className="section-header"><h2 className="section-title">Transactions</h2></div>
                      <div className="table-container">
                        <table className="table">
                          <thead><tr><th>ID</th><th>Date</th><th>Type</th><th>Receiver</th><th>Amount</th></tr></thead>
                          <tbody>
                            {transactions.map(tx => (
                              <tr key={tx.id}>
                                <td style={{ fontFamily:'monospace', fontSize:11 }}>#{tx.id}</td>
                                <td>{fmtDate(tx.created_at)}</td>
                                <td style={{ textTransform:'capitalize' }}>{tx.type}</td>
                                <td>{tx.receiver_name || 'N/A'}</td>
                                <td style={{ color: tx.type === 'deposit' ? 'var(--green-success)' : 'var(--red-error)', fontWeight:600 }}>{tx.type === 'deposit' ? '+' : '-'}{fmt(tx.amount, currency)}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                  
                  {view === 'transfer' && (
                    <div>
                      <div className="section-header"><h2 className="section-title">Send Money</h2></div>
                      <div style={{ maxWidth:600, margin:'0 auto' }}>
                        <div style={{ background:'var(--white)', border:'1px solid var(--gray-200)', borderRadius:12, padding:32 }}>
                          <form onSubmit={(e) => { e.preventDefault(); showToast('Transfer successful!'); }}>
                            <div className="form-group">
                              <label className="form-label">From Account</label>
                              <select className="form-select">
                                {accounts.map(a => <option key={a.id}>{a.account_number} — {fmt(a.balance, currency)}</option>)}
                              </select>
                            </div>
                            <div className="form-group">
                              <label className="form-label">To Account</label>
                              <input className="form-input" placeholder="Recipient account number" />
                            </div>
                            <div className="form-group">
                              <label className="form-label">Amount</label>
                              <input className="form-input" type="number" step="0.01" placeholder="0.00" />
                            </div>
                            <button type="submit" className="btn btn-primary btn-lg" style={{ width:'100%' }}>Send Transfer</button>
                          </form>
                        </div>
                      </div>
                    </div>
                  )}
                  
                  {view === 'profile' && (
                    <div>
                      <div className="section-header"><h2 className="section-title">My Profile</h2></div>
                      <div style={{ maxWidth:600, margin:'0 auto', background:'var(--white)', border:'1px solid var(--gray-200)', borderRadius:12, padding:32 }}>
                        <div style={{ textAlign:'center', marginBottom:24 }}>
                          <div style={{ width:100, height:100, borderRadius:'50%', background:'var(--teal-pale)', display:'inline-flex', alignItems:'center', justifyContent:'center', fontSize:40 }}>
                            {auth.user.first_name?.[0] || 'U'}
                          </div>
                          <h3 style={{ marginTop:12 }}>{auth.user.first_name} {auth.user.last_name}</h3>
                          <p style={{ color:'var(--gray-600)' }}>{auth.user.email}</p>
                        </div>
                        <div style={{ display:'grid', gap:12 }}>
                          <div style={{ display:'flex', justifyContent:'space-between', padding:'12px 0', borderBottom:'1px solid var(--gray-200)' }}>
                            <span style={{ color:'var(--gray-600)' }}>Name:</span>
                            <span style={{ fontWeight:600 }}>{auth.user.first_name} {auth.user.last_name}</span>
                          </div>
                          <div style={{ display:'flex', justifyContent:'space-between', padding:'12px 0', borderBottom:'1px solid var(--gray-200)' }}>
                            <span style={{ color:'var(--gray-600)' }}>Email:</span>
                            <span style={{ fontWeight:600 }}>{auth.user.email}</span>
                          </div>
                          <div style={{ display:'flex', justifyContent:'space-between', padding:'12px 0' }}>
                            <span style={{ color:'var(--gray-600)' }}>Role:</span>
                            <span style={{ fontWeight:600, textTransform:'capitalize' }}>{auth.user.role || 'User'}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                  
                  {view === 'branches' && (
                    <div>
                      <div className="section-header">
                        <h2 className="section-title">Our Branches</h2>
                        <p className="section-subtitle">CorpCommercial Bank operates worldwide</p>
                      </div>
                      <div className="cards-grid">
                        {[
                          { city: 'New York, USA', address: 'DFE541 Street, New York, NY', phone: '+1 (903) 517-0151' },
                          { city: 'Berlin, Germany', address: 'Eichborndamm 167, 13403 Berlin', phone: '+49 16 301 54371' },
                          { city: 'Toronto, Canada', address: '100 King Street West, Toronto, ON', phone: '+1 (416) 555-0199' }
                        ].map((b, i) => (
                          <div key={i} className="card">
                            <h3 style={{ fontSize:18, fontWeight:600, marginBottom:8 }}>{b.city}</h3>
                            <p style={{ fontSize:14, color:'var(--gray-600)', whiteSpace:'pre-line' }}>{b.address}</p>
                            <p style={{ fontSize:14, fontWeight:600, color:'var(--teal-primary)', marginTop:8 }}>{b.phone}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            }
            
            <LiveChat user={auth.user} />
            
            {/* Footer */}
            <footer className="footer">
              <div className="container">
                <div className="footer-grid">
                  <div><h4 className="footer-title">About Us</h4><a href="#" className="footer-link">About</a><a href="#" className="footer-link">Careers</a><a href="#" className="footer-link">Contact</a></div>
                  <div><h4 className="footer-title">Services</h4><a href="#" className="footer-link">Personal Banking</a><a href="#" className="footer-link">Business Banking</a><a href="#" className="footer-link">Investments</a></div>
                  <div><h4 className="footer-title">Support</h4><a href="#" className="footer-link">Help Center</a><a href="#" className="footer-link">Security</a><a href="#" className="footer-link">Contact Support</a></div>
                  <div><h4 className="footer-title">Legal</h4><a href="#" className="footer-link">Privacy Policy</a><a href="#" className="footer-link">Terms of Service</a><a href="#" className="footer-link">Compliance</a></div>
                </div>
                <div className="footer-bottom">© 2026 CorpCommercial Bank Financial Services. All rights reserved.</div>
              </div>
            </footer>
          </div>
        );
      };
      
      // Render
      const root = document.getElementById('root');
      if (root) {
        ReactDOM.createRoot(root).render(
          <LanguageProvider>
            <App />
          </LanguageProvider>
        );
      }
      
    })();
  </script>
</body>

</html>
