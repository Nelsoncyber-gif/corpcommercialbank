<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CorpCommercial Bank – Financial Services</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal-primary: #00596B;
      --teal-dark: #003D4A;
      --teal-light: #4A8B99;
      --teal-pale: #E6F3F5;
      --white: #FFFFFF;
      --off-white: #F8FAFB;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-300: #D1D5DB;
      --gray-400: #9CA3AF;
      --gray-500: #6B7280;
      --gray-600: #4B5563;
      --gray-700: #374151;
      --gray-800: #1F2937;
      --gray-900: #111827;
      --blue-accent: #0EA5E9;
      --green-success: #10B981;
      --red-error: #EF4444;
      --orange-warning: #F59E0B;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--gray-900);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-weight: 600;
      line-height: 1.2;
    }

    .container {
      width: 100%;
      padding: 0 20px;
      margin: 0 auto;
    }

    @media (min-width: 640px) { .container { max-width: 640px; } }
    @media (min-width: 768px) { .container { max-width: 768px; padding: 0 32px; } }
    @media (min-width: 1024px) { .container { max-width: 1024px; } }
    @media (min-width: 1280px) { .container { max-width: 1200px; } }

    /* FIXED TOP NAVIGATION - ENSURES SIGN OUT VISIBLE */
    .top-nav {
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: var(--shadow-sm);
    }

    .top-nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      gap: 16px;
      max-width: 100%;
      flex-wrap: wrap;
    }

    @media (min-width: 1024px) {
      .top-nav-inner {
        padding: 0 40px;
        flex-wrap: nowrap;
        height: 70px;
      }
    }

    .logo-box {
      background: var(--teal-primary);
      padding: 8px 12px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      .logo-box { padding: 12px 20px; }
    }

    .logo-text {
      font-family: 'Source Serif 4', serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.5px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    @media (min-width: 768px) { .logo-text { font-size: 18px; } }
    @media (min-width: 1024px) { .logo-text { font-size: 20px; } }

    .logo-tagline {
      font-size: 7px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    @media (min-width: 768px) { .logo-tagline { font-size: 9px; } }
    @media (min-width: 1024px) { .logo-tagline { font-size: 10px; } }

    /* NAV LINKS - SCROLLABLE ON MOBILE */
    .nav-links {
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      flex: 1;
      min-width: 0;
      padding: 8px 0;
      order: 2;
    }

    @media (min-width: 1024px) {
      .nav-links {
        order: 1;
        overflow-x: visible;
        flex: 0 1 auto;
        justify-content: center;
      }
    }

    .nav-links::-webkit-scrollbar {
      height: 3px;
    }

    .nav-links::-webkit-scrollbar-track {
      background: var(--gray-200);
      border-radius: 10px;
    }

    .nav-links::-webkit-scrollbar-thumb {
      background: var(--teal-primary);
      border-radius: 10px;
    }

    .nav-link {
      font-size: 12px;
      font-weight: 500;
      color: var(--gray-700);
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: 6px;
    }

    @media (min-width: 768px) {
      .nav-link { font-size: 13px; padding: 8px 12px; }
    }

    @media (min-width: 1024px) {
      .nav-link { font-size: 14px; }
    }

    .nav-link:hover, .nav-link.active {
      color: var(--teal-primary);
      background: var(--teal-pale);
    }

    /* NAV ACTIONS - ALWAYS VISIBLE */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      order: 1;
      margin-left: auto;
    }

    @media (min-width: 1024px) {
      .nav-actions { order: 2; margin-left: 0; }
    }

    .nav-actions select {
      padding: 6px 8px;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      font-size: 11px;
      background: var(--white);
      cursor: pointer;
    }

    @media (min-width: 768px) {
      .nav-actions select { padding: 8px 12px; font-size: 14px; }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: inherit;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary { background: var(--teal-primary); color: var(--white); }
    .btn-primary:hover { background: var(--teal-dark); transform: translateY(-1px); box-shadow: var(--shadow); }
    .btn-outline { background: transparent; color: var(--teal-primary); border: 2px solid var(--teal-primary); }
    .btn-outline:hover { background: var(--teal-primary); color: var(--white); }
    .btn-ghost { background: transparent; color: var(--gray-700); }
    .btn-ghost:hover { background: var(--gray-100); }
    .btn-sm { padding: 6px 14px; font-size: 13px; }
    .btn-lg { padding: 14px 28px; font-size: 16px; }

    /* SIGN OUT BUTTON - ALWAYS VISIBLE */
    .sign-out-btn {
      white-space: nowrap;
      flex-shrink: 0;
      min-width: fit-content;
    }

    .mobile-menu-btn {
      display: flex;
      background: none;
      border: none;
      font-size: 24px;
      color: var(--gray-700);
      cursor: pointer;
      padding: 8px;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 1024px) {
      .mobile-menu-btn { display: none; }
    }

    /* MOBILE MENU */
    .mobile-menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 1100;
      animation: fadeIn 0.25s ease-out;
    }

    .mobile-menu-overlay.open { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .mobile-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 85%;
      max-width: 380px;
      height: 100vh;
      background: var(--white);
      box-shadow: -8px 0 32px rgba(0,0,0,0.15);
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1200;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .mobile-menu.open { right: 0; }

    .mobile-menu-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--white);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .mobile-menu-close {
      background: none;
      border: none;
      font-size: 28px;
      color: var(--gray-700);
      cursor: pointer;
      padding: 8px;
    }

    .mobile-menu-items {
      padding: 16px 24px 40px;
      flex: 1;
    }

    .mobile-menu-item {
      display: block;
      padding: 14px 0;
      font-size: 15px;
      font-weight: 500;
      color: var(--gray-700);
      border-bottom: 1px solid var(--gray-100);
      cursor: pointer;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .mobile-menu-item.active {
      color: var(--teal-primary);
      font-weight: 600;
    }

    .mobile-currency-selector {
      padding: 16px;
      background: var(--gray-50);
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .mobile-currency-selector label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 8px;
    }

    .mobile-currency-selector select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      font-size: 14px;
      background: var(--white);
    }

    /* Keep rest of your existing styles below... */
    .hero {
      position: relative;
      height: 600px;
      background: linear-gradient(135deg, rgba(0, 89, 107, 0.85) 0%, rgba(0, 61, 74, 0.9) 100%),
        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1920&q=80') center/cover no-repeat;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      color: var(--white);
      max-width: 800px;
      padding: 0 20px;
    }

    .hero-label {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hero-title {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.2;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    @media (min-width: 768px) { .hero-title { font-size: 52px; } }

    .hero-subtitle {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.95;
      max-width: 600px;
      margin-bottom: 32px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
    }

    @media (min-width: 768px) { .hero-subtitle { font-size: 20px; } }

    .hero-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 480px) {
      .hero-buttons { flex-direction: column; gap: 10px; }
      .hero-buttons button { width: 100%; }
      .hero-title { font-size: 28px; }
      .hero-subtitle { font-size: 16px; }
    }

    /* Keep all your existing component styles from here... */
    .section { padding: 60px 0; }
    @media (min-width: 768px) { .section { padding: 80px 0; } }
    .section-header { text-align: center; margin-bottom: 48px; }
    .section-title { font-size: 32px; color: var(--teal-primary); margin-bottom: 12px; }
    @media (min-width: 768px) { .section-title { font-size: 40px; } }
    .section-subtitle { font-size: 16px; color: var(--gray-600); max-width: 700px; margin: 0 auto; line-height: 1.6; }
    .cards-grid { display: grid; gap: 24px; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
    .card { background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px; padding: 28px; transition: all 0.3s; cursor: pointer; }
    .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-4px); border-color: var(--teal-light); }
    .account-card { background: linear-gradient(135deg, var(--teal-primary) 0%, var(--teal-dark) 100%); color: var(--white); border-radius: 12px; padding: 28px; position: relative; overflow: hidden; }
    .account-card::after { content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); }
    .account-card-label { font-size: 12px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .account-card-number { font-family: 'Inter', monospace; font-size: 14px; opacity: 0.75; margin-bottom: 20px; letter-spacing: 1px; }
    .account-card-balance { font-size: 36px; font-weight: 700; margin-bottom: 4px; }
    .account-card-balance-label { font-size: 13px; opacity: 0.75; }
    .account-card.frozen { background: linear-gradient(135deg, var(--gray-600) 0%, var(--gray-700) 100%); }
    .stats-grid { display: grid; gap: 20px; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
    .stat-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px; padding: 24px; text-align: center; }
    .stat-value { font-size: 32px; font-weight: 700; color: var(--teal-primary); margin-bottom: 4px; }
    .stat-label { font-size: 14px; color: var(--gray-600); text-transform: uppercase; letter-spacing: 1px; }
    .table-container { background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px; overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; }
    .table th { background: var(--gray-50); padding: 14px 16px; text-align: left; font-size: 12px; font-weight: 700; color: var(--gray-700); text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--gray-200); }
    .table td { padding: 14px 16px; font-size: 14px; color: var(--gray-900); border-bottom: 1px solid var(--gray-200); }
    .table tr:last-child td { border-bottom: none; }
    .table tr:hover { background: var(--gray-50); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 14px; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; padding: 12px 16px; border: 1px solid var(--gray-300); border-radius: 6px; font-size: 14px; font-family: inherit; color: var(--gray-900); background: var(--white); transition: all 0.2s; }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--teal-primary); box-shadow: 0 0 0 3px var(--teal-pale); }
    .form-hint { font-size: 13px; color: var(--gray-500); margin-top: 4px; }
    .badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; }
    .badge-success { background: #D1FAE5; color: #065F46; }
    .badge-error { background: #FEE2E2; color: #991B1B; }
    .badge-warning { background: #FEF3C7; color: #92400E; }
    .badge-info { background: #DBEAFE; color: #1E40AF; }
    .toast { position: fixed; top: 80px; right: 20px; background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px; padding: 16px 20px; box-shadow: var(--shadow-xl); z-index: 2000; animation: slideInRight 0.3s ease; max-width: 400px; display: flex; align-items: flex-start; gap: 12px; }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast.success { border-left: 4px solid var(--green-success); }
    .toast.error { border-left: 4px solid var(--red-error); }
    .toast.warning { border-left: 4px solid var(--orange-warning); }
    .chat-fab { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%; background: var(--teal-primary); color: var(--white); font-size: 24px; border: none; cursor: pointer; box-shadow: var(--shadow-xl); display: flex; align-items: center; justify-content: center; z-index: 900; transition: all 0.3s; }
    .chat-fab:hover { background: var(--teal-dark); transform: scale(1.1); }
    .chat-panel { position: fixed; bottom: 100px; right: 24px; width: 90%; max-width: 380px; height: 500px; background: var(--white); border: 1px solid var(--gray-200); border-radius: 12px; box-shadow: var(--shadow-xl); display: flex; flex-direction: column; z-index: 900; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .chat-header { background: var(--teal-primary); color: var(--white); padding: 16px 20px; border-radius: 12px 12px 0 0; display: flex; align-items: center; justify-content: space-between; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; background: var(--gray-50); }
    .chat-message { margin-bottom: 12px; display: flex; flex-direction: column; }
    .chat-bubble { padding: 10px 14px; border-radius: 12px; max-width: 75%; word-wrap: break-word; }
    .chat-message.user { align-items: flex-end; }
    .chat-message.user .chat-bubble { background: var(--teal-primary); color: var(--white); border-bottom-right-radius: 4px; }
    .chat-message.admin { align-items: flex-start; }
    .chat-message.admin .chat-bubble { background: var(--white); border: 1px solid var(--gray-200); color: var(--gray-900); border-bottom-left-radius: 4px; }
    .chat-time { font-size: 11px; color: var(--gray-500); margin-top: 4px; padding: 0 4px; }
    .chat-input-bar { padding: 16px; border-top: 1px solid var(--gray-200); display: flex; gap: 8px; }
    .chat-input { flex: 1; padding: 10px 14px; border: 1px solid var(--gray-300); border-radius: 6px; font-size: 14px; font-family: inherit; }
    .footer { background: var(--teal-primary); color: var(--white); padding: 48px 0 32px; }
    .footer-grid { display: grid; gap: 32px; grid-template-columns: 1fr; margin-bottom: 32px; }
    @media (min-width: 768px) { .footer-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .footer-grid { grid-template-columns: repeat(4, 1fr); } }
    .footer-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .footer-link { display: block; color: rgba(255, 255, 255, 0.8); text-decoration: none; font-size: 14px; margin-bottom: 10px; transition: color 0.2s; }
    .footer-link:hover { color: var(--white); }
    .footer-bottom { border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 24px; text-align: center; font-size: 13px; color: rgba(255, 255, 255, 0.7); }
    .loader-container { display: flex; align-items: center; justify-content: center; min-height: 400px; }
    .loader { width: 48px; height: 48px; border: 4px solid var(--gray-200); border-top-color: var(--teal-primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .alert { padding: 14px 18px; border-radius: 6px; margin-bottom: 20px; display: flex; align-items: flex-start; gap: 12px; }
    .alert-warning { background: rgba(245, 158, 11, 0.1); border: 1px solid var(--orange-warning); color: #92400E; }
    .alert-error { background: #FEE2E2; border: 1px solid var(--red-error); color: #991B1B; }
    .alert-info { background: #DBEAFE; border: 1px solid var(--blue-accent); color: #1E40AF; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; overflow-y: auto; }
    .modal { background: var(--white); border-radius: 12px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-xl); animation: modalSlideIn 0.3s ease; }
    @keyframes modalSlideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    .modal-header { padding: 20px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; }
    .modal-close { background: none; border: none; font-size: 24px; color: var(--gray-500); cursor: pointer; padding: 4px; line-height: 1; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 20px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 12px; }
    @media (max-width: 414px) {
      .modal-overlay { padding: 10px; align-items: flex-start; padding-top: 40px; }
      .modal { max-height: 85vh; border-radius: 8px; }
    }
  </style>
</head>

<body>
  <div id="root"></div>
