<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CorpCommercial Bank – Financial Services</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --teal-primary: #00596B;
      --teal-dark: #003D4A;
      --teal-light: #4A8B99;
      --teal-pale: #E6F3F5;
      --white: #FFFFFF;
      --off-white: #F8FAFB;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-300: #D1D5DB;
      --gray-400: #9CA3AF;
      --gray-500: #6B7280;
      --gray-600: #4B5563;
      --gray-700: #374151;
      --gray-800: #1F2937;
      --gray-900: #111827;
      --blue-accent: #0EA5E9;
      --green-success: #10B981;
      --red-error: #EF4444;
      --orange-warning: #F59E0B;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--gray-900);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-weight: 600;
      line-height: 1.2;
    }

    /* MOBILE-FIRST RESPONSIVE */
    .container {
      width: 100%;
      padding: 0 20px;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      .container {
        max-width: 640px;
      }
    }

    @media (min-width: 768px) {
      .container {
        max-width: 768px;
        padding: 0 32px;
      }
    }

    @media (min-width: 1024px) {
      .container {
        max-width: 1024px;
      }
    }

    @media (min-width: 1280px) {
      .container {
        max-width: 1200px;
      }
    }

    /* TOP NAVIGATION - IMPROVED MOBILE RESPONSIVENESS */
    .top-nav {
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: var(--shadow-sm);
    }

    .top-nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
      padding: 0 16px;
      max-width: 100%;
    }

    @media (min-width: 1024px) {
      .top-nav-inner {
        padding: 0 40px;
        max-width: 1400px;
        margin: 0 auto;
      }
    }

    .logo-box {
      background: var(--teal-primary);
      padding: 10px 16px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex-shrink: 0;
    }

    .logo-text {
      font-family: 'Source Serif 4', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.5px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .logo-tagline {
      font-size: 8px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    @media (min-width: 768px) {
      .logo-text { font-size: 18px; }
      .logo-tagline { font-size: 9px; }
      .logo-box { padding: 12px 20px; }
    }

    @media (min-width: 1024px) {
      .logo-text { font-size: 20px; }
      .logo-tagline { font-size: 10px; }
    }

    .nav-links {
      display: none;
      gap: 32px;
      align-items: center;
    }

    @media (min-width: 1024px) {
      .nav-links { display: flex; }
    }

    .nav-link {
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-700);
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }

    .nav-link:hover, .nav-link.active { color: var(--teal-primary); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (min-width: 768px) {
      .nav-actions { gap: 12px; }
    }

    /* Currency selector - hide on very small screens */
    .nav-actions select {
      display: none;
    }

    @media (min-width: 480px) {
      .nav-actions select {
        display: block;
        padding: 6px 8px;
        border: 1px solid var(--gray-300);
        border-radius: 6px;
        font-size: 12px;
        background: var(--white);
        cursor: pointer;
      }
    }

    @media (min-width: 768px) {
      .nav-actions select {
        padding: 8px 12px;
        font-size: 14px;
      }
    }

    .mobile-menu-btn {
      display: flex;
      background: none;
      border: none;
      font-size: 28px;
      color: var(--gray-700);
      cursor: pointer;
      padding: 8px;
      line-height: 1;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
    }

    @media (min-width: 1024px) {
      .mobile-menu-btn { display: none; }
    }

    /* MOBILE MENU OVERLAY */
    .mobile-menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1100;
      animation: fadeIn 0.2s;
    }

    .mobile-menu-overlay.open { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .mobile-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 85%;
      max-width: 360px;
      height: 100vh;
      background: var(--white);
      box-shadow: var(--shadow-xl);
      transition: right 0.3s ease;
      z-index: 1200;
      overflow-y: auto;
    }

    .mobile-menu.open { right: 0; }

    .mobile-menu-header {
      padding: 20px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 70px;
    }

    .mobile-menu-close {
      background: none;
      border: none;
      font-size: 32px;
      color: var(--gray-700);
      cursor: pointer;
      padding: 8px;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mobile-menu-items {
      padding: 20px;
    }

    .mobile-menu-item {
      display: block;
      padding: 16px 0;
      font-size: 16px;
      font-weight: 500;
      color: var(--gray-700);
      text-decoration: none;
      border-bottom: 1px solid var(--gray-100);
      cursor: pointer;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      min-height: 48px;
      display: flex;
      align-items: center;
    }

    .mobile-menu-item:hover, .mobile-menu-item.active {
      color: var(--teal-primary);
      background: var(--teal-pale);
    }

    .mobile-currency-selector {
      padding: 16px 0;
      border-bottom: 1px solid var(--gray-100);
      margin-bottom: 16px;
    }

    .mobile-currency-selector label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .mobile-currency-selector select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      font-size: 14px;
      background: var(--white);
      cursor: pointer;
      font-family: inherit;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: inherit;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--teal-primary);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--teal-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    .btn-outline {
      background: transparent;
      color: var(--teal-primary);
      border: 2px solid var(--teal-primary);
    }

    .btn-outline:hover {
      background: var(--teal-primary);
      color: var(--white);
    }

    .btn-ghost {
      background: transparent;
      color: var(--gray-700);
    }

    .btn-ghost:hover {
      background: var(--gray-100);
    }

    .btn-sm {
      padding: 6px 14px;
      font-size: 13px;
    }

    .btn-lg {
      padding: 14px 28px;
      font-size: 16px;
    }

    /* MOBILE MENU OVERLAY */
    .mobile-menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 9998 !important;
      animation: fadeIn 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .mobile-menu-overlay.open {
      display: block !important;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .mobile-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 85%;
      max-width: 360px;
      height: 100vh;
      height: 100dvh;
      background: var(--white);
      box-shadow: var(--shadow-xl);
      transition: right 0.3s ease;
      z-index: 9999 !important;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .mobile-menu.open {
      right: 0 !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .mobile-menu-header {
      padding: 20px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mobile-menu-close {
      background: none;
      border: none;
      font-size: 28px;
      color: var(--gray-700);
      cursor: pointer;
      padding: 4px;
    }

    .mobile-menu-items {
      padding: 20px;
      padding-bottom: 60px !important;
    }

    .mobile-menu-item {
      display: block !important;
      padding: 14px 0;
      font-size: 16px;
      font-weight: 500;
      color: var(--gray-700);
      text-decoration: none;
      border-bottom: 1px solid var(--gray-100);
      cursor: pointer;
      background: none !important;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .mobile-menu-item:hover,
    .mobile-menu-item.active {
      color: var(--teal-primary);
    }

    /* HERO SECTION WITH TRANSPARENT OVERLAY */
    .hero {
      position: relative;
      height: 600px;
      background: linear-gradient(135deg, rgba(0, 89, 107, 0.85) 0%, rgba(0, 61, 74, 0.9) 100%),
        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1920&q=80') center/cover no-repeat;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      color: var(--white);
      max-width: 800px;
      padding: 0 20px;
    }

    .hero-label {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hero-title {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.2;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    @media (min-width: 768px) {
      .hero-title {
        font-size: 52px;
      }
    }

    .hero-subtitle {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.95;
      max-width: 600px;
      margin-bottom: 32px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
    }

    @media (min-width: 768px) {
      .hero-subtitle {
        font-size: 20px;
      }
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Form section anchor */
    .form-section-anchor {
      scroll-margin-top: 20px;
    }

    /* Responsive hero buttons */
    .hero-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-buttons button {
      flex: 1;
      min-width: 140px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .hero-buttons button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 480px) {
      .hero-buttons {
        flex-direction: column;
        gap: 10px;
      }

      .hero-buttons button {
        width: 100%;
        min-width: unset;
      }

      .hero-title {
        font-size: 28px;
      }

      .hero-subtitle {
        font-size: 16px;
      }
    }

    /* SECTIONS */
    .section {
      padding: 60px 0;
    }

    @media (min-width: 768px) {
      .section {
        padding: 80px 0;
      }
    }

    .section-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .section-title {
      font-size: 32px;
      color: var(--teal-primary);
      margin-bottom: 12px;
    }

    @media (min-width: 768px) {
      .section-title {
        font-size: 40px;
      }
    }

    .section-subtitle {
      font-size: 16px;
      color: var(--gray-600);
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* CARDS */
    .cards-grid {
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 640px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .cards-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      padding: 28px;
      transition: all 0.3s;
      cursor: pointer;
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-4px);
      border-color: var(--teal-light);
    }

    .card-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--teal-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--white);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--gray-900);
      margin-bottom: 8px;
    }

    .card-description {
      font-size: 14px;
      color: var(--gray-600);
      line-height: 1.6;
    }

    /* ACCOUNT CARDS */
    .account-card {
      background: linear-gradient(135deg, var(--teal-primary) 0%, var(--teal-dark) 100%);
      color: var(--white);
      border-radius: 12px;
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .account-card::after {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }

    .account-card-label {
      font-size: 12px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .account-card-number {
      font-family: 'Inter', monospace;
      font-size: 14px;
      opacity: 0.75;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .account-card-balance {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .account-card-balance-label {
      font-size: 13px;
      opacity: 0.75;
    }

    .account-card.frozen {
      background: linear-gradient(135deg, var(--gray-600) 0%, var(--gray-700) 100%);
    }

    /* STATS */
    .stats-grid {
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 640px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .stat-card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--teal-primary);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 14px;
      color: var(--gray-600);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* TABLE */
    .table-container {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      overflow-x: auto;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th {
      background: var(--gray-50);
      padding: 14px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: var(--gray-700);
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid var(--gray-200);
    }

    .table td {
      padding: 14px 16px;
      font-size: 14px;
      color: var(--gray-900);
      border-bottom: 1px solid var(--gray-200);
    }

    .table tr:last-child td {
      border-bottom: none;
    }

    .table tr:hover {
      background: var(--gray-50);
    }

    /* FORMS */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 6px;
    }

    .form-input,
    .form-select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: var(--gray-900);
      background: var(--white);
      transition: all 0.2s;
    }

    .form-input:focus,
    .form-select:focus {
      outline: none;
      border-color: var(--teal-primary);
      box-shadow: 0 0 0 3px var(--teal-pale);
    }

    .form-hint {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 4px;
    }

    /* BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-success {
      background: #D1FAE5;
      color: #065F46;
    }

    .badge-error {
      background: #FEE2E2;
      color: #991B1B;
    }

    .badge-warning {
      background: #FEF3C7;
      color: #92400E;
    }

    .badge-info {
      background: #DBEAFE;
      color: #1E40AF;
    }

    /* TOAST */
    .toast {
      position: fixed;
      top: 80px;
      right: 20px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      padding: 16px 20px;
      box-shadow: var(--shadow-xl);
      z-index: 2000;
      animation: slideInRight 0.3s ease;
      max-width: 400px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    @keyframes slideInRight {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .toast.success {
      border-left: 4px solid var(--green-success);
    }

    .toast.error {
      border-left: 4px solid var(--red-error);
    }

    .toast.warning {
      border-left: 4px solid var(--orange-warning);
    }

    /* CHAT FAB */
    .chat-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--teal-primary);
      color: var(--white);
      font-size: 24px;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 900;
      transition: all 0.3s;
    }

    .chat-fab:hover {
      background: var(--teal-dark);
      transform: scale(1.1);
    }

    /* CHAT PANEL */
    .chat-panel {
      position: fixed;
      bottom: 100px;
      right: 24px;
      width: 90%;
      max-width: 380px;
      height: 500px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      box-shadow: var(--shadow-xl);
      display: flex;
      flex-direction: column;
      z-index: 900;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-header {
      background: var(--teal-primary);
      color: var(--white);
      padding: 16px 20px;
      border-radius: 12px 12px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: var(--gray-50);
    }

    .chat-message {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    .chat-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 75%;
      word-wrap: break-word;
    }

    .chat-message.user {
      align-items: flex-end;
    }

    .chat-message.user .chat-bubble {
      background: var(--teal-primary);
      color: var(--white);
      border-bottom-right-radius: 4px;
    }

    .chat-message.admin {
      align-items: flex-start;
    }

    .chat-message.admin .chat-bubble {
      background: var(--white);
      border: 1px solid var(--gray-200);
      color: var(--gray-900);
      border-bottom-left-radius: 4px;
    }

    .chat-time {
      font-size: 11px;
      color: var(--gray-500);
      margin-top: 4px;
      padding: 0 4px;
    }

    .chat-input-bar {
      padding: 16px;
      border-top: 1px solid var(--gray-200);
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    /* FOOTER */
    .footer {
      background: var(--teal-primary);
      color: var(--white);
      padding: 48px 0 32px;
    }

    .footer-grid {
      display: grid;
      gap: 32px;
      grid-template-columns: 1fr;
      margin-bottom: 32px;
    }

    @media (min-width: 768px) {
      .footer-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .footer-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .footer-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .footer-link {
      display: block;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 10px;
      transition: color 0.2s;
    }

    .footer-link:hover {
      color: var(--white);
    }

    .footer-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 24px;
      text-align: center;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* LOADER */
    .loader-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 400px;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid var(--gray-200);
      border-top-color: var(--teal-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* UTILITIES */
    .text-center {
      text-align: center;
    }

    .text-muted {
      color: var(--gray-600);
    }

    .mb-4 {
      margin-bottom: 16px;
    }

    .mb-6 {
      margin-bottom: 24px;
    }

    .mt-4 {
      margin-top: 16px;
    }

    .mt-6 {
      margin-top: 24px;
    }

    .hidden {
      display: none;
    }

    /* ALERT */
    .alert {
      padding: 14px 18px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .alert-warning {
      background: var(--orange-warning)/10;
      border: 1px solid var(--orange-warning);
      color: #92400E;
    }

    .alert-error {
      background: #FEE2E2;
      border: 1px solid var(--red-error);
      color: #991B1B;
    }

    .alert-info {
      background: #DBEAFE;
      border: 1px solid var(--blue-accent);
      color: #1E40AF;
    }

    /* AUTH PAGE BACKGROUND */
    .auth-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1920&q=80') center/cover no-repeat;
      z-index: -1;
      animation: backgroundSlide 60s ease-in-out infinite;
    }

    @keyframes backgroundSlide {

      0%,
      24% {
        background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1920&q=80');
      }

      25%,
      49% {
        background-image: url('https://plus.unsplash.com/premium_photo-1661772661721-b16346e4be4d?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8YnVzaW5lc3N8ZW58MHx8MHx8fDA%3D');
      }

      50%,
      74% {
        background-image: url('https://plus.unsplash.com/premium_photo-1661758211006-d41106e4be4d?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fGJ1c2luZXNzfGVufDB8fDB8fHww');
      }

      75%,
      100% {
        background-image: url('https://plus.unsplash.com/premium_photo-1681995453325-455f7084888d?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTd8fGJ1c2luZXNzfGVufDB8fDB8fHww');
      }
    }

    .auth-background::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(0, 89, 107, 0.85) 0%, rgba(0, 61, 74, 0.9) 100%);
    }

    /* Auth page specific styles */
    .auth-page .hero {
      background: transparent;
      height: 300px;
    }

    .auth-page .hero::before {
      display: none;
    }

    .auth-page .form-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    /* CORPCOMMERCIAL DESIGN STYLES */
    /* Hero Carousel */
    .hero-carousel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .carousel-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      display: flex;
      align-items: center;
    }

    .carousel-slide.active {
      opacity: 1;
      z-index: 1;
    }

    .carousel-dots {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .carousel-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: all 0.3s;
    }

    .carousel-dot.active {
      background: var(--white);
      width: 40px;
      border-radius: 6px;
    }

    /* Stats Section */
    .stats-section {
      background: var(--white);
      padding: 60px 0;
      border-top: 1px solid var(--gray-200);
    }

    .stats-boxes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .stats-boxes {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .stat-box {
      text-align: center;
      padding: 30px 20px;
      background: var(--gray-50);
      border-radius: 8px;
      border: 1px solid var(--gray-200);
      transition: all 0.3s;
    }

    .stat-box:hover {
      background: var(--teal-pale);
      border-color: var(--teal-light);
      transform: translateY(-5px);
    }

    .stat-number {
      font-size: 42px;
      font-weight: 700;
      color: var(--teal-primary);
      margin-bottom: 8px;
      font-family: 'Source Serif 4', serif;
    }

    .stat-text {
      font-size: 14px;
      color: var(--gray-600);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Services Section */
    .services-section {
      background: var(--off-white);
      padding: 80px 0;
    }

    .service-cards {
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr;
      max-width: 1200px;
      margin: 40px auto 0;
    }

    @media (min-width: 640px) {
      .service-cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .service-cards {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .service-card {
      background: var(--white);
      border-radius: 12px;
      padding: 32px 24px;
      border: 1px solid var(--gray-200);
      transition: all 0.3s;
      cursor: pointer;
    }

    .service-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-8px);
      border-color: var(--teal-primary);
    }

    .service-icon {
      width: 70px;
      height: 70px;
      background: var(--teal-primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .service-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 12px;
    }

    .service-description {
      font-size: 14px;
      color: var(--gray-600);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .service-features {
      list-style: none;
      margin: 16px 0;
    }

    .service-features li {
      font-size: 13px;
      color: var(--gray-700);
      padding: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .service-features li::before {
      content: '✓';
      color: var(--green-success);
      font-weight: 700;
      font-size: 16px;
    }

    /* Team Section */
    .team-section {
      background: var(--white);
      padding: 80px 0;
    }

    .team-grid {
      display: grid;
      gap: 32px;
      grid-template-columns: 1fr;
      max-width: 1200px;
      margin: 40px auto 0;
    }

    @media (min-width: 640px) {
      .team-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .team-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .team-card {
      background: var(--white);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--gray-200);
      transition: all 0.3s;
      text-align: center;
    }

    .team-card:hover {
      box-shadow: var(--shadow-xl);
      transform: translateY(-10px);
    }

    .team-photo {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background: var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      color: var(--white);
    }

    .team-info {
      padding: 24px 20px;
      background: var(--gray-50);
    }

    .team-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 6px;
    }

    .team-role {
      font-size: 14px;
      color: var(--teal-primary);
      font-weight: 600;
    }

    /* Testimonials Section */
    .testimonials-section {
      background: var(--off-white);
      padding: 80px 0;
    }

    .testimonials-carousel {
      max-width: 900px;
      margin: 40px auto 0;
      position: relative;
    }

    .testimonial-slide {
      display: none;
      text-align: center;
      padding: 40px;
      background: var(--white);
      border-radius: 12px;
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow);
    }

    .testimonial-slide.active {
      display: block;
      animation: fadeIn 0.5s;
    }

    .testimonial-photo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 20px;
      border: 4px solid var(--teal-pale);
      background: var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .testimonial-text {
      font-size: 16px;
      color: var(--gray-700);
      line-height: 1.8;
      font-style: italic;
      margin-bottom: 20px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    .testimonial-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 4px;
    }

    .testimonial-company {
      font-size: 14px;
      color: var(--teal-primary);
      font-weight: 600;
    }

    .testimonial-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }

    .testimonial-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--gray-300);
      cursor: pointer;
      transition: all 0.3s;
    }

    .testimonial-dot.active {
      background: var(--teal-primary);
      width: 40px;
      border-radius: 6px;
    }

    /* Section Headers */
    .section-label {
      font-size: 14px;
      font-weight: 700;
      color: #FF6B35;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .section-main-title {
      font-size: 36px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 16px;
      font-family: 'Source Serif 4', serif;
    }

    @media (min-width: 768px) {
      .section-main-title {
        font-size: 42px;
      }
    }

    .emergency-box {
      background: #FF6B35;
      color: var(--white);
      padding: 16px 24px;
      border-radius: 8px;
      display: inline-block;
      margin-top: 24px;
    }

    .emergency-label {
      font-size: 12px;
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .emergency-phone {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* About Features */
    .about-features {
      list-style: none;
      margin: 24px 0;
    }

    .about-features li {
      font-size: 15px;
      color: var(--gray-700);
      padding: 10px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
    }

    .about-features li::before {
      content: '✓';
      color: var(--green-success);
      font-weight: 700;
      font-size: 20px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #D1FAE5;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Quick Actions FAB */
    .quick-actions-fab {
      position: fixed;
      bottom: 100px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--teal-primary);
      color: var(--white);
      font-size: 24px;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 850;
      transition: all 0.3s;
    }

    .quick-actions-fab:hover {
      background: var(--teal-dark);
      transform: scale(1.1);
    }

    .quick-actions-menu {
      position: fixed;
      bottom: 170px;
      right: 24px;
      width: 90%;
      max-width: 320px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      box-shadow: var(--shadow-xl);
      display: none;
      flex-direction: column;
      z-index: 850;
      animation: slideUp 0.3s ease;
    }

    .quick-actions-menu.open {
      display: flex;
    }

    .quick-actions-close {
      align-self: flex-end;
      background: none;
      border: none;
      font-size: 20px;
      color: var(--gray-500);
      cursor: pointer;
      padding: 12px;
    }

    .quick-action-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--gray-100);
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      color: var(--gray-900);
    }

    .quick-action-item:hover {
      background: var(--gray-50);
    }

    .quick-action-item:last-child {
      border-bottom: none;
    }

    .quick-action-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--teal-pale);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .quick-action-content {
      flex: 1;
    }

    .quick-action-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--gray-900);
    }

    .quick-action-subtitle {
      font-size: 12px;
      color: var(--gray-500);
    }

    /* ========================================
   COMPREHENSIVE MOBILE-FIRST MEDIA QUERIES
   ======================================== */

    /* iPhone XR/11/12/13 Pro Max (414px width) */
    @media (max-width: 414px) {

      /* Hero section adjustments */
      .hero {
        height: 500px;
      }

      .hero-title {
        font-size: 28px;
      }

      .hero-subtitle {
        font-size: 15px;
      }

      .hero-label {
        font-size: 12px;
        padding: 8px 16px;
      }

      /* Auth page hero */
      .auth-page .hero {
        height: 250px;
      }

      /* Section adjustments */
      .section {
        padding: 40px 0;
      }

      .section-title {
        font-size: 24px;
      }

      .section-subtitle {
        font-size: 14px;
      }

      /* Container padding */
      .container {
        padding: 0 16px;
      }

      /* Stats grid - force single column */
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .stat-value {
        font-size: 28px;
      }

      /* Cards grid - force single column */
      .cards-grid {
        grid-template-columns: 1fr;
      }

      /* Account card adjustments */
      .account-card {
        padding: 20px;
      }

      .account-card-balance {
        font-size: 28px;
      }

      /* Table adjustments - better mobile viewing */
      .table th {
        font-size: 11px;
        padding: 10px 8px;
      }

      .table td {
        font-size: 12px;
        padding: 10px 8px;
      }

      /* Form adjustments */
      .form-input,
      .form-select {
        font-size: 16px;
        /* Prevents zoom on iOS */
        padding: 10px 12px;
      }

      /* Button adjustments */
      .btn {
        padding: 12px 16px;
        font-size: 14px;
      }

      .btn-lg {
        padding: 14px 20px;
        font-size: 15px;
      }

      /* Modal adjustments */
      .modal {
        width: 95%;
        max-width: none;
        margin: 20px;
      }

      /* Chat panel - full width on small screens */
      .chat-panel {
        width: 95%;
        right: 2.5%;
        bottom: 80px;
        height: 60vh;
        max-height: 500px;
      }

      /* Chat FAB positioning */
      .chat-fab {
        bottom: 16px;
        right: 16px;
        width: 56px;
        height: 56px;
      }

      /* Quick actions FAB */
      .quick-actions-fab {
        bottom: 80px;
        right: 16px;
        width: 52px;
        height: 52px;
      }

      .quick-actions-menu {
        width: 95%;
        right: 2.5%;
        bottom: 145px;
      }

      /* Navigation adjustments */
      .nav-actions {
        gap: 8px;
      }

      .nav-actions select {
        font-size: 14px;
        padding: 6px 8px;
      }

      /* Mobile menu - iOS FIX */
      .mobile-menu {
        width: 90%;
        max-width: none;
        right: -90%;
      }

      .mobile-menu.open {
        right: 0;
      }

      .mobile-menu-items {
        padding: 16px;
        padding-bottom: 40px;
      }

      .mobile-menu-item {
        padding: 16px 0;
        font-size: 15px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .mobile-menu-header {
        padding: 16px;
        position: sticky;
        top: 0;
        background: var(--white);
        z-index: 10;
      }

      .mobile-menu-close {
        font-size: 32px;
        padding: 8px;
        touch-action: manipulation;
      }

      /* Dashboard nav links in mobile */
      .dashboard-nav .nav-link {
        font-size: 13px;
        padding: 8px 4px;
      }

      /* Service cards adjustments */
      .service-card {
        padding: 20px 16px;
      }

      .service-icon {
        width: 56px;

      return new Intl.NumberFormat('en-US', { style: 'currency', currency: currency }).format(converted);

    // PENDING APPROVALS COMPONENT (ADMIN)
    const PendingApprovals = ({ adminData, auth, showToast, loadData, API }) => {
      const [approvals, setApprovals] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        loadApprovals();
      }, []);

      const loadApprovals = async () => {
        try {
          const r = await fetch(`${API}/admin/pending-approvals`, {
            headers: { Authorization: `Bearer ${auth.token}` }
          });
          const d = await r.json();
          if (d.success) {
            setApprovals(d.pendingApprovals || []);
          }
        } catch (err) {
          console.error('Load approvals error:', err);
        } finally {
          setLoading(false);
        }
      };

      const handleApprove = async (approvalId) => {
        if (!confirm('Are you sure you want to approve this account request?')) return;
        try {
          const r = await fetch(`${API}/admin/approve-account`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${auth.token}`
            },
            body: JSON.stringify({ approvalId })
          });
          const d = await r.json();
          if (d.success) {
            showToast('Account approved successfully!');
            loadApprovals();
            loadData(auth.token, auth.user);
          } else {
            showToast(d.message, 'error');
          }
        } catch (err) {
          console.error('Approve error:', err);
          showToast('Failed to approve account', 'error');
        }
      };

      const handleReject = async (approvalId) => {
        const reason = prompt('Enter rejection reason (optional):');
        try {
          const r = await fetch(`${API}/admin/reject-account`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${auth.token}`
            },
            body: JSON.stringify({ approvalId, reason: reason || 'Account rejected' })
          });
          const d = await r.json();
          if (d.success) {
            showToast('Account request rejected');
            loadApprovals();
          } else {
            showToast(d.message, 'error');
          }
        } catch (err) {
          console.error('Reject error:', err);
          showToast('Failed to reject account', 'error');
        }
      };

      if (loading) {
        return <div className="loader-container"><div className="loader" /></div>;
      }

      return <div>
        <div className="table-container">
          <table className="table">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Account Number</th>
                <th>Requested Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {approvals.map(approval => (
                <tr key={approval.id}>
                  <td style={{ fontWeight: 600 }}>{approval.first_name} {approval.last_name}</td>
                  <td style={{ color: 'var(--gray-600)' }}>{approval.email}</td>
                  <td style={{ color: 'var(--gray-600)' }}>{approval.phone || 'N/A'}</td>
                  <td style={{ fontFamily: 'monospace', fontSize: 13 }}>{approval.account_number}</td>
                  <td style={{ color: 'var(--gray-600)', fontSize: 13 }}>{fmtDate(approval.requested_at)}</td>
                  <td style={{ display: 'flex', gap: 8 }}>
                    <button
                      className="btn btn-sm"
                      style={{ background: 'var(--green-success)', color: 'var(--white)' }}
                      onClick={() => handleApprove(approval.id)}
                    >
                      ✓ Approve
                    </button>
                    <button
                      className="btn btn-sm"
                      style={{ background: 'var(--red-error)', color: 'var(--white)' }}
                      onClick={() => handleReject(approval.id)}
                    >
                      ✕ Reject
                    </button>
                  </td>
                </tr>
              ))}
              {approvals.length === 0 && (
                <tr>
                  <td colSpan="6" style={{ textAlign: 'center', color: 'var(--gray-500)', padding: 40 }}>
                    <div style={{ fontSize: 48, marginBottom: 16 }}>✅</div>
                    <div>No pending approvals</div>
                    <div style={{ fontSize: 13, marginTop: 8 }}>All account requests have been processed</div>
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
      </div>;
    };

                      <input type="checkbox" name="lowBalanceAlerts" defaultChecked style={{ width: 20, height: 20 }} />
                      <div>
                        <div style={{ fontWeight: 600, color: 'var(--gray-900)' }}>⚠️ Low Balance Alerts</div>
                        <div style={{ fontSize: 13, color: 'var(--gray-600)' }}>Warning when balance is low</div>
                      </div>
                    </label>
                    <label style={{ display: 'flex', alignItems: 'center', gap: 12, padding: 16, background: 'var(--gray-50)', borderRadius: 8, cursor: 'pointer' }}>
                      <input type="checkbox" name="loginAlerts" defaultChecked style={{ width: 20, height: 20 }} />
                      <div>
                        <div style={{ fontWeight: 600, color: 'var(--gray-900)' }}>🔐 Login Alerts</div>
                        <div style={{ fontSize: 13, color: 'var(--gray-600)' }}>Get notified of new logins</div>
                      </div>
                    </label>
                  </div>
                  <button type="submit" className="btn btn-primary btn-lg" style={{ width: '100%', marginTop: 24 }}>Save Preferences</button>
                </form>
              </div>
              <div style={{ background: 'var(--white)', border: '1px solid var(--gray-200)', borderRadius: 12, padding: 24 }}>
                <h3 style={{ fontSize: 18, fontWeight: 600, marginBottom: 16, color: 'var(--teal-primary)' }}>Recent Notifications</h3>
                <div style={{ display: 'grid', gap: 12 }}>
                  <div style={{ padding: 16, background: 'var(--teal-pale)', borderRadius: 8, borderLeft: '4px solid var(--teal-primary)' }}>
                    <div style={{ fontWeight: 600, color: 'var(--teal-dark)', marginBottom: 4 }}>🎉 Welcome to CorpCommercial Bank!</div>
                    <div style={{ fontSize: 13, color: 'var(--gray-600)' }}>Thank you for banking with us. Explore our features to make the most of your banking experience.</div>
                    <div style={{ fontSize: 11, color: 'var(--gray-500)', marginTop: 8 }}>Just now</div>
                  </div>
                  <div style={{ padding: 16, background: 'var(--gray-50)', borderRadius: 8, borderLeft: '4px solid var(--gray-400)' }}>
                    <div style={{ fontWeight: 600, color: 'var(--gray-700)', marginBottom: 4 }}>📋 Complete Your Profile</div>
                    <div style={{ fontSize: 13, color: 'var(--gray-600)' }}>Add your contact information and preferences for better service.</div>
                    <div style={{ fontSize: 11, color: 'var(--gray-500)', marginTop: 8 }}>Pending</div>
                  </div>
                </div>
              </div>
            </div>}
            {view === 'branches' && <div>
              <div className="section-header">
                <h2 className="section-title">Our Global Branches</h2>
                <p className="section-subtitle">CorpCommercial Bank operates in the world's most important financial markets</p>
              </div>
              <div style={{ background: 'var(--teal-pale)', border: '1px solid var(--teal-light)', borderRadius: 8, padding: 20, marginBottom: 32, textAlign: 'center' }}>
                <div style={{ fontSize: 14, color: 'var(--teal-dark)', marginBottom: 8 }}>💱 Current Display Currency</div>
                <div style={{ fontSize: 24, fontWeight: 700, color: 'var(--teal-primary)' }}>{CURRENCY_RATES[currency]?.symbol} {currency} - {CURRENCY_RATES[currency]?.name}</div>
                <div style={{ fontSize: 13, color: 'var(--gray-600)', marginTop: 8 }}>Select a different currency from the dropdown in the navigation bar</div>
              </div>
              <div className="cards-grid">
                {[
                  { city: 'New York, USA', image: 'https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=600&q=80', currency: 'USD', address: 'DFE541 Street\nNew York, NY USA', phone: '+1 (903) 517-0151' },
                  { city: 'Berlin, Germany', image: 'https://images.unsplash.com/photo-1560969184-10fe8719b047?w=600&q=80', currency: 'EUR', address: 'Eichborndamm 167\n13403 Berlin Germany', phone: '+49 16 301 54371' },
                  { city: 'Toronto, Canada', image: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600&q=80', currency: 'CAD', address: '100 King Street West\nToronto, ON M5X 1C9 Canada', phone: '+1 (416) 555-0199' },
                ].map((b, i) => <div key={i} className="card" style={{ padding: 0, overflow: 'hidden' }}>
                  <img src={b.image} alt={b.city} style={{ width: '100%', height: '200px', objectFit: 'cover' }} />
                  <div style={{ padding: '24px' }}>
                    <h3 style={{ fontSize: 18, fontWeight: 600, marginBottom: 8 }}>{b.city}</h3>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
                      <span className="badge badge-info" style={{ fontSize: 12 }}>{b.currency}</span>
                      <span style={{ fontSize: 13, color: 'var(--gray-500)' }}>Local Currency</span>
                    </div>
                    <p style={{ fontSize: 14, color: 'var(--gray-600)', whiteSpace: 'pre-line', marginBottom: 12 }}>{b.address}</p>
                    <p style={{ fontSize: 14, fontWeight: 600, color: 'var(--teal-primary)' }}>{b.phone}</p>
                    <div style={{ marginTop: 16, fontSize: 13, color: 'var(--gray-500)' }}>
                      Exchange Rate: 1 {currency} = {(CURRENCY_RATES[b.currency]?.rate / (CURRENCY_RATES[currency]?.rate || 1)).toFixed(4)} {b.currency}
                    </div>
                  </div>
                </div>)}
              </div>
            </div>}
            {view === 'customers' && auth.user.role === 'admin' && <CustomerManagement adminData={adminData} auth={auth} showToast={showToast} loadData={loadData} API={API} currency={currency} />}
            {view === 'approvals' && auth.user.role === 'admin' && <div>
              <div className="section-header">
                <h2 className="section-title">Pending Account Approvals</h2>
                <p className="section-subtitle">Review and approve customer account requests</p>
              </div>
              <PendingApprovals adminData={adminData} auth={auth} showToast={showToast} loadData={loadData} API={API} />
            </div>}
            {view === 'deposit' && auth.user.role === 'admin' && <div>
              <div className="section-header">
                <h2 className="section-title">Process Customer Deposit</h2>
                <p className="section-subtitle">Process deposits on behalf of customers from verified sources</p>
              </div>
              <div style={{ maxWidth: 600, margin: '0 auto' }}>
                <div className="alert alert-info">💡 <strong>Admin Action:</strong> Process deposits from cash, checks, wires, ATM, or mobile deposits</div>
                <div style={{ background: 'var(--white)', border: '1px solid var(--gray-200)', borderRadius: 12, padding: 32 }}>
                  <form onSubmit={async e => {
                    e.preventDefault();
                    const fd = new FormData(e.target);
                    const userId = fd.get('user');
                    // First get user's accounts
                    try {
                      const ar = await fetch(`${API}/admin/user-accounts/${userId}`, { headers: { Authorization: `Bearer ${auth.token}` } });
                      const ad = await ar.json();
                      if (ad.success && ad.accounts.length > 0) {
                        const r = await fetch(`${API}/accounts/deposit`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${auth.token}` }, body: JSON.stringify({ accountId: ad.accounts[0].id, amount: parseFloat(fd.get('amount')) }) });
                        const d = await r.json();
                        if (d.success) { showToast('Deposit processed successfully!'); loadData(auth.token, auth.user); e.target.reset(); }
                        else showToast(d.message, 'error');
                      } else { showToast('User has no accounts', 'error'); }
                    } catch (err) { console.error(err); showToast('Deposit failed', 'error'); }
                  }}>
                    <div className="form-group">
                      <label className="form-label">Select Customer</label>
                      <select name="user" className="form-select" required>
                        <option value="">Choose a customer...</option>
                        {adminData.users.filter(u => u.role !== 'admin').map(u => <option key={u.id} value={u.id}>{u.first_name} {u.last_name} ({u.email})</option>)}
                      </select>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Deposit Source</label>
                      <select name="source" className="form-select" required>
                        <option value="">Select source...</option>
                        <option value="Cash">💵 Cash Deposit (Teller)</option>
                        <option value="Check">📝 Check Deposit</option>
                        <option value="Wire">🏦 Wire Transfer</option>
                        <option value="ATM">🏧 ATM Deposit</option>
                        <option value="Mobile">📱 Mobile Check Deposit</option>
                      </select>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Reference Number</label>
                      <input name="ref" className="form-input" placeholder="CHK-12345, WIRE-67890, TXN-00001" required />
                      <div className="form-hint">Enter check number, transaction ID, or reference</div>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Amount (USD)</label>
                      <input name="amount" type="number" step="0.01" min="0.01" className="form-input" placeholder="0.00" required />
                    </div>
                    <button type="submit" className="btn btn-primary btn-lg" style={{ width: '100%' }}>Process Deposit</button>
                  </form>
                </div>
              </div>
            </div>}
            {view === 'admin-transactions' && auth.user.role === 'admin' && <div>
              <div className="section-header">
                <h2 className="section-title">All System Transactions</h2>
                <p className="section-subtitle">Complete transaction history across all accounts</p>
              </div>
              <div className="table-container">
                <table className="table">
                  <thead><tr><th>Transaction ID</th><th>Date</th><th>Type</th><th>Receiver</th><th>Account Number</th><th>Bank</th><th>Account ID</th><th>Amount</th><th>Status</th></tr></thead>
                  <tbody>
                    {adminData.allTransactions.slice(0, 100).map(tx => { const c = tx.type === 'deposit' || tx.type === 'transfer_in'; return <tr key={tx.id}><td style={{ fontFamily: 'monospace', fontSize: 12, color: 'var(--gray-500)' }}>TXN-#{tx.id}</td><td style={{ color: 'var(--gray-600)', fontSize: 13 }}>{fmtDate(tx.created_at)}</td><td style={{ textTransform: 'capitalize' }}>{tx.type?.replace('_', ' ')}</td><td style={{ fontWeight: 600 }}>{tx.receiver_name || 'N/A'}</td><td style={{ fontFamily: 'monospace', fontSize: 13 }}>{tx.receiver_account_number || 'N/A'}</td><td style={{ fontSize: 13, color: 'var(--gray-600)' }}>{tx.bank_name || 'N/A'}</td><td style={{ fontFamily: 'monospace', fontSize: 13 }}>#{tx.account_id}</td><td style={{ color: c ? 'var(--green-success)' : 'var(--red-error)', fontWeight: 600 }}>{c ? '+' : '-'}{fmt(tx.amount, currency)}</td><td><span className="badge badge-success">Complete</span></td></tr> })}
                    {adminData.allTransactions.length === 0 && <tr><td colSpan="9" style={{ textAlign: 'center', color: 'var(--gray-500)', padding: 40 }}>No transactions yet</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>}
            {view === 'backdate' && auth.user.role === 'admin' && <div>
              <div className="section-header">
                <h2 className="section-title">Backdate Transaction</h2>
                <p className="section-subtitle">Update the date of an existing transaction</p>
              </div>
              <div style={{ maxWidth: 600, margin: '0 auto' }}>
                <div className="alert alert-info">💡 <strong>Admin Action:</strong> Change the transaction date for corrections or adjustments</div>
                <div style={{ background: 'var(--white)', border: '1px solid var(--gray-200)', borderRadius: 12, padding: 32 }}>
                  <div className="alert alert-info" style={{ marginBottom: 20 }}>
                    <strong>📋 How to find Transaction ID:</strong> Go to "All Transactions" view and look for the TXN-# number in the first column. Enter only the number (e.g., if TXN-#5, enter 5).
                  </div>
                  <form onSubmit={async e => {
                    e.preventDefault();
                    const fd = new FormData(e.target);
                    try {
                      const r = await fetch(`${API}/admin/backdate-transaction`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${auth.token}` }, body: JSON.stringify({ transactionId: parseInt(fd.get('transactionId')), newDate: fd.get('newDate') }) });
                      const d = await r.json();
                      if (d.success) { showToast('Transaction backdated successfully!'); loadData(auth.token, auth.user); e.target.reset(); }
                      else showToast(d.message, 'error');
                    } catch (err) { console.error(err); showToast('Failed to backdate transaction', 'error'); }
                  }}>
                    <div className="form-group">
                      <label className="form-label">Transaction ID</label>
                      <input name="transactionId" type="number" className="form-input" placeholder="e.g., 1, 2, 3" required />
                      <div className="form-hint">Enter only the number from TXN-# (e.g., if TXN-#5, enter 5)</div>
                    </div>
                    <div className="form-group">
                      <label className="form-label">New Date/Time</label>
                      <input name="newDate" type="datetime-local" className="form-input" required />
                      <div className="form-hint">Select the date and time to assign to this transaction</div>
                    </div>
                    <button type="submit" className="btn btn-primary btn-lg" style={{ width: '100%' }}>Backdate Transaction</button>
                  </form>
                </div>
              </div>
            </div>}
            <LiveChat user={auth.user} />
          </div>
        </div>}

        {/* FOOTER */}
        <footer className="footer">
          <div className="container">
            <div className="footer-grid">
              <div><h4 className="footer-title">About Us</h4>{['About', 'Leadership', 'Careers', 'Contact'].map(l => <a key={l} href="#" className="footer-link">{l}</a>)}</div>
              <div><h4 className="footer-title">Services</h4>{['Personal Banking', 'Business Banking', 'Investments', 'Insurance'].map(l => <a key={l} href="#" className="footer-link">{l}</a>)}</div>
              <div><h4 className="footer-title">Support</h4>{['Help Center', 'Security', 'FAQs', 'Contact Support'].map(l => <a key={l} href="#" className="footer-link">{l}</a>)}</div>
              <div><h4 className="footer-title">Legal</h4>{['Privacy Policy', 'Terms of Service', 'Compliance', 'Accessibility'].map(l => <a key={l} href="#" className="footer-link">{l}</a>)}</div>
            </div>
            <div className="footer-bottom">© 2026 CorpCommercial Bank Financial Services. All rights reserved.</div>
          </div>
        </footer>
      </div>
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
